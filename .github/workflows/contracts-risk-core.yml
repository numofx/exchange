# .github/workflows/contracts-risk-core.yml
name: contracts-risk-core
on:
  push:
    branches: [main]
    paths: ['contracts/risk-core/**', '.github/workflows/contracts-risk-core.yml']
  pull_request:
    paths: ['contracts/risk-core/**', '.github/workflows/contracts-risk-core.yml']
concurrency:
  group: risk-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/risk-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive        # public submodules only — no SSH secret needed anymore
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.7.1"  # exact pin — `stable` differs across machines (local foundryup vs GH). Run `foundryup --install 1.7.1` locally.
      - run: forge fmt --check   # requires foundry.toml [fmt] keys to be valid — see PLAN note
      - run: forge build scripts/*.s.sol   # scripts/ sits outside foundry's default `script` path, so forge test never compiles it
      # offline: covers keccak, the setOracleContingencyParams selector, and the provenance checks
      # (log.address / tx.to == SRM, tx.from == vault) that gate action-6 confirmation
      - run: python3 scripts/ops/resolve_cngn_action6.py --self-test
      # offline: the 10 selectors propose_cngn_spot_batch.py hardcodes. Its skip check swallows
      # errors into "not landed", so a wrong selector degrades silently rather than crashing.
      - run: python3 scripts/ops/propose_cngn_spot_batch.py --self-test
      # Added with the market-1 batch and the settlement canary. Each of these scripts hardcodes
      # function selectors and hashes; every one of the three had a wrong selector when first
      # written from memory, and the self-tests are what caught them. Unrun, they prove nothing.
      - run: python3 scripts/ops/propose_market1_inert_batch.py --self-test
      - run: python3 scripts/ops/check_settlement_canary.py --self-test
      - run: python3 scripts/ops/refresh_deployment_artifacts.py --self-test
      - run: forge test -vvv
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}   # every suite under test/fork/ needs it

      # These fork suites are the only assertions this repo makes about chain state it does not
      # control: the DFXM cash freeze, the market-1 inert batch, the unbacked-balance burn, the
      # cNGN spot preconditions. Losing them is silent -- the summary line counts a suite that
      # did not run as neither passed nor failed.
      #
      # Unlike contracts-execution, a MISSING secret is already loud here: these call
      # vm.envString("BASE_RPC_URL"), which reverts, so setUp fails the suite rather than
      # skipping it. Verified by running with the variable unset -- it reports
      # [FAIL: vm.envString: environment variable "BASE_RPC_URL" not found] setUp().
      #
      # So this guards the case that is NOT loud: a suite that stops running at all. The expected
      # count is derived from the files on disk rather than hardcoded, so adding a fork suite
      # raises the bar automatically and deleting one has to be deliberate.
      - name: every fork suite must run, and none may skip
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          expected=$(ls test/fork/*.t.sol | wc -l | tr -d ' ')
          echo "fork suites on disk: $expected"
          out=$(forge test --match-path 'test/fork/*' -vv)
          echo "$out"
          grep -qE "Ran ${expected} test suites" <<<"$out" || {
            echo "::error::expected ${expected} fork suites to run; see the summary line above"
            exit 1
          }
          grep -qE '[1-9][0-9]* tests passed, 0 failed, 0 skipped' <<<"$out" || {
            echo "::error::a fork test skipped, or none ran -- a skip reads as a pass in the summary"
            exit 1
          }
