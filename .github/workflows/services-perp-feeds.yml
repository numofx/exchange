# .github/workflows/services-perp-feeds.yml
# The USDCcNGN-PERP price publishers, and the cNGN future's forward publisher (forward-main.ts). The
# anvil suites run too: they deploy the real feed contracts (and FutureAssetV1, the live v1 series, and the v2 FutureAsset) from risk-core and check
# they accept what the service signs, so they need forge and anvil.
name: services-perp-feeds
on:
  push:
    branches: [main]
    paths:
      - 'services/perp-feeds/**'
      - 'contracts/risk-core/src/feeds/**'
      - 'contracts/risk-core/src/periphery/OracleDataSubmitter.sol'
      - 'contracts/risk-core/src/assets/FutureAsset.sol'
      - 'contracts/risk-core/src/legacy/v1/FutureAssetV1.sol'
      - 'packages/kms-signer/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/services-perp-feeds.yml'
  pull_request:
    paths:
      - 'services/perp-feeds/**'
      - 'contracts/risk-core/src/feeds/**'
      - 'contracts/risk-core/src/periphery/OracleDataSubmitter.sol'
      - 'contracts/risk-core/src/assets/FutureAsset.sol'
      - 'contracts/risk-core/src/legacy/v1/FutureAssetV1.sol'
      - 'packages/kms-signer/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/services-perp-feeds.yml'
concurrency:
  group: services-perp-feeds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      # the forward publisher signs through @numo/kms-signer, which resolves from its dist
      - run: pnpm --filter @numo/kms-signer build
      - run: pnpm --filter perp-feeds run check
      - run: pnpm --filter perp-feeds run build
      - run: forge build src/feeds/LyraSpotFeed.sol src/feeds/LyraSpotDiffFeed.sol src/feeds/LyraForwardFeed.sol src/periphery/OracleDataSubmitter.sol src/legacy/v1/FutureAssetV1.sol src/assets/FutureAsset.sol src/SubAccounts.sol
        working-directory: contracts/risk-core
      - run: |
          anvil --port 8599 --silent &
          sleep 2
          ANVIL_RPC_URL=http://127.0.0.1:8599 pnpm --filter perp-feeds test
